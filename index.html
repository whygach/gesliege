<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GesLiège</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Ccircle cx=%2216%22 cy=%2216%22 r=%2215%22 fill=%22%23C4833E%22/%3E%3Ccircle cx=%2211%22 cy=%2212%22 r=%222%22 fill=%22%238C5B30%22/%3E%3Ccircle cx=%2220%22 cy=%2210%22 r=%221.5%22 fill=%22%238C5B30%22/%3E%3Ccircle cx=%2218%22 cy=%2221%22 r=%222.4%22 fill=%22%238C5B30%22/%3E%3Ccircle cx=%229%22 cy=%2221%22 r=%221.3%22 fill=%22%238C5B30%22/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.100.0/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<style>
/* Layout : bandeau écorce (brun liège, texture de granulés) au-dessus d'une aire de travail pierre claire ; l'ocre du liège porte les actions, le vert du chêne-liège l'état sain. */
:root{
  --bg:#E8E6E1; --surface:#FBFAF8; --surface-2:#F2F0EC; --line:#DAD5CD; --line-2:#C5BEB3;
  --ink:#271D16; --ink-2:#5C5047; --ink-3:#877A6F;
  --band:#2E2016; --band-2:#432F21; --band-ink:#F3ECE3; --band-ink-2:#BCA690;
  --signal:#C4833E; --signal-ink:#1F150E; --grain:#8C5B30; --steel:#3E6B4E;
  --ok:#3B7350; --warn:#A8620F; --crit:#B23A2E;
  --c-mp:#8A5A33; --c-sf:#C4833E; --c-gr:#A08A5C; --c-pf:#3E6B4E; --c-mc:#5D6B7A; --c-im:#6E4F7A;
  --f-display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  --r:6px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#17120E; --surface:#201913; --surface-2:#281F18; --line:#3A2E24; --line-2:#4C3D30;
  --ink:#EEE6DC; --ink-2:#BBAD9F; --ink-3:#8E8073;
  --band:#0F0B08; --band-2:#2A1F16; --band-ink:#EEE6DC; --band-ink-2:#A8927C;
  --signal:#DDA060; --signal-ink:#1A120B; --grain:#6E4626; --steel:#7FB08E;
  --ok:#6FBF8A; --warn:#E3A04F; --crit:#EE7466;
  --c-mp:#C99467; --c-sf:#DDA060; --c-gr:#CDB98C; --c-pf:#7FB08E; --c-mc:#97A6B5; --c-im:#B596C2;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#17120E; --surface:#201913; --surface-2:#281F18; --line:#3A2E24; --line-2:#4C3D30;
  --ink:#EEE6DC; --ink-2:#BBAD9F; --ink-3:#8E8073;
  --band:#0F0B08; --band-2:#2A1F16; --band-ink:#EEE6DC; --band-ink-2:#A8927C;
  --signal:#DDA060; --signal-ink:#1A120B; --grain:#6E4626; --steel:#7FB08E;
  --ok:#6FBF8A; --warn:#E3A04F; --crit:#EE7466;
  --c-mp:#C99467; --c-sf:#DDA060; --c-gr:#CDB98C; --c-pf:#7FB08E; --c-mc:#97A6B5; --c-im:#B596C2;
  color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
.auth{max-width:420px;margin:24px auto 0;display:flex;flex-direction:column;gap:14px}
.auth .panel .body{display:flex;flex-direction:column;gap:12px}
.auth h2{font-family:var(--f-display);font-weight:700;font-size:28px;letter-spacing:-.015em;margin:0}
.auth p{margin:0;color:var(--ink-2)}
.linkbtn{background:none;border:0;color:var(--ink-2);text-decoration:underline;cursor:pointer;padding:0;font-size:13px}
.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;color:var(--ink-2)}
.steps code{font-family:var(--f-mono);font-size:12.5px;background:var(--surface-2);padding:1px 5px;border-radius:3px}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--band)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--signal);outline-offset:2px}
.num,td.n,th.n{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.wrap{max-width:1280px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* Bandeau */
header.band{background:radial-gradient(circle at 20% 30%,color-mix(in srgb,var(--grain) 55%,transparent) 0 1.2px,transparent 1.6px) 0 0/9px 11px,radial-gradient(circle at 70% 60%,color-mix(in srgb,var(--grain) 40%,transparent) 0 1px,transparent 1.5px) 0 0/13px 7px,var(--band);color:var(--band-ink);position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
.band .top{display:flex;align-items:center;gap:12px;padding-block:12px 6px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto}
.mark{width:30px;height:30px;border-radius:50%;background:radial-gradient(circle at 30% 35%,var(--grain) 0 2px,transparent 2.5px),radial-gradient(circle at 65% 30%,var(--grain) 0 1.5px,transparent 2px),radial-gradient(circle at 55% 68%,var(--grain) 0 2.2px,transparent 2.7px),radial-gradient(circle at 25% 70%,var(--grain) 0 1.2px,transparent 1.7px),radial-gradient(circle at 78% 55%,var(--grain) 0 1.3px,transparent 1.8px),var(--signal);box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--band) 35%,transparent)}
.brand h1{font-family:var(--f-display);font-weight:700;font-size:25px;letter-spacing:-.01em;margin:0;line-height:1}
.brand small{display:block;font-size:11px;color:var(--band-ink-2);letter-spacing:.08em;text-transform:uppercase;margin-top:2px}
.mode{font-size:12px;padding:3px 9px;border-radius:99px;border:1px solid var(--band-2);color:var(--band-ink-2);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.mode i{width:7px;height:7px;border-radius:50%;background:var(--band-ink-2)}
.mode.live i{background:var(--ok)} .mode.demo i,.mode.local i{background:var(--signal)}
nav.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{background:none;border:0;color:var(--band-ink-2);padding:10px 14px 12px;cursor:pointer;font-family:var(--f-display);font-weight:600;font-size:15.5px;white-space:nowrap;border-bottom:3px solid transparent}
nav.tabs button:hover{color:var(--band-ink)}
nav.tabs button[aria-current="page"]{color:var(--band-ink);border-bottom-color:var(--signal)}
.btn-band{background:var(--band-2);border:1px solid var(--band-2);color:var(--band-ink);border-radius:var(--r);padding:6px 12px;cursor:pointer;font-size:13px;white-space:nowrap}
.btn-band:hover{border-color:var(--band-ink-2)}

.banner{background:var(--signal);color:var(--signal-ink);font-size:13px}
.banner .wrap{display:flex;gap:12px;align-items:center;padding-block:8px;flex-wrap:wrap}
.banner button{background:var(--signal-ink);color:var(--signal);border:0;border-radius:4px;padding:4px 10px;cursor:pointer;font-size:12px}

main{padding-block:22px 48px}
.page-head{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.page-head h2{font-family:var(--f-display);font-weight:700;font-size:31px;letter-spacing:-.015em;margin:0;line-height:1.05;text-wrap:balance;margin-right:auto}
.page-head p{margin:4px 0 0;color:var(--ink-2);font-size:13px;max-width:65ch}
.grow{flex:1;min-width:0}

/* Boutons */
.btn{display:inline-flex;align-items:center;gap:6px;border-radius:var(--r);padding:8px 14px;border:1px solid var(--line-2);background:var(--surface);cursor:pointer;font-size:13.5px;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--signal);border-color:var(--signal);color:var(--signal-ink);font-weight:600}
.btn.primary:hover{filter:brightness(1.05)}
.btn.danger{color:var(--crit);border-color:color-mix(in srgb,var(--crit) 40%,var(--line))}
.btn.sm{padding:4px 9px;font-size:12.5px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.ghost{background:none;border-color:transparent;color:var(--ink-2)}
.btn.ghost:hover{color:var(--ink);border-color:var(--line)}

/* Tuiles */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:18px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:4px;min-width:0}
.kpi .l{font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.kpi .v{font-family:var(--f-mono);font-size:22px;font-weight:500;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.kpi .v small{font-size:13px;color:var(--ink-3);font-family:var(--f-body)}
.kpi .s{font-size:12.5px;color:var(--ink-2)}
.kpi.warn .v{color:var(--warn)} .kpi.crit .v{color:var(--crit)}

.cols{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px;align-items:start}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);min-width:0}
.panel>h3{font-family:var(--f-display);font-weight:600;font-size:16.5px;margin:0;padding:12px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
.panel>h3 .aside{margin-left:auto;font-family:var(--f-body);font-size:12px;letter-spacing:0;text-transform:none;color:var(--ink-3);font-weight:400}
.panel .body{padding:14px 16px}
.panel.alerts>h3{background:radial-gradient(circle at 30% 40%,var(--grain) 0 1.6px,transparent 2.1px) 0 0/10px 9px,radial-gradient(circle at 70% 70%,color-mix(in srgb,var(--band) 50%,transparent) 0 1.4px,transparent 1.9px) 0 0/7px 12px,var(--signal);border-radius:var(--r) var(--r) 0 0;padding:0;border-bottom:0}
.panel.alerts>h3 span{background:var(--band);color:var(--band-ink);padding:6px 10px;margin:8px;border-radius:3px}
.stack{display:flex;flex-direction:column;gap:16px}

/* Barres par compte */
.acc{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.acc:last-child{border-bottom:0}
.acc .code{font-family:var(--f-mono);font-size:13px;color:var(--ink-2)}
.acc .lab{font-size:13.5px}
.acc .val{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:13.5px;text-align:right}
.acc .bar{grid-column:2/4;height:6px;background:var(--surface-2);border-radius:3px;overflow:hidden}
.acc .bar i{display:block;height:100%;border-radius:3px}
.acc.total{border-top:2px solid var(--ink);border-bottom:0;margin-top:2px}
.acc.total .lab{font-weight:600}

.alert-row{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.alert-row:last-child{border-bottom:0}
.alert-row .grow b{font-weight:500}
.alert-row .grow small{display:block;color:var(--ink-3);font-size:12px}

/* Pastilles */
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:99px;white-space:nowrap;letter-spacing:.02em}
.pill.ok{background:color-mix(in srgb,var(--ok) 15%,transparent);color:var(--ok)}
.pill.warn{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}
.pill.crit{background:color-mix(in srgb,var(--crit) 15%,transparent);color:var(--crit)}
.pill.neutral{background:var(--surface-2);color:var(--ink-2)}
.pill.trf{background:color-mix(in srgb,var(--signal) 18%,transparent);color:color-mix(in srgb,var(--signal) 65%,var(--ink))}
.cat{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-2);white-space:nowrap}
.cat i{width:9px;height:9px;border-radius:2px;flex:none}
.cat b{font-family:var(--f-mono);font-weight:500;color:var(--ink)}

/* Barre d'outils */
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line-2);background:var(--surface);border-radius:99px;padding:5px 12px;font-size:13px;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.chip .cnt{font-family:var(--f-mono);font-size:11.5px;opacity:.7}
.search{position:relative;flex:1;min-width:180px;max-width:340px;margin-left:auto}
.search input{width:100%;padding:8px 12px 8px 32px;border:1px solid var(--line-2);border-radius:var(--r);background:var(--surface)}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--ink-3)}

/* Tables */
.tw{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.panel .tw{border:0;border-radius:0}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);font-weight:600;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface-2)}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.n,th.n{text-align:right;white-space:nowrap}
td .sub{display:block;font-size:12px;color:var(--ink-3)}
td.code{font-family:var(--f-mono);font-size:13px;white-space:nowrap}
tbody tr:hover td{background:color-mix(in srgb,var(--surface-2) 60%,transparent)}
tr.clickable{cursor:pointer}
.acts{display:flex;gap:4px;justify-content:flex-end}
.qty-low{color:var(--warn)} .qty-zero{color:var(--crit)}
tfoot td{font-weight:600;border-top:2px solid var(--ink);background:var(--surface-2)}
.neg{color:var(--crit)} .pos{color:var(--ok)}
.muted{color:var(--ink-3)}
.note{font-size:12.5px;color:var(--ink-3);margin-top:8px}

/* États vides */
.empty{padding:40px 20px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px}
.empty h3{font-family:var(--f-display);font-weight:700;font-size:25px;letter-spacing:-.01em;margin:0}
.empty p{color:var(--ink-2);margin:0;max-width:52ch}
.empty .row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.empty .tape{width:56px;height:56px;border-radius:50%;background:radial-gradient(circle at 30% 35%,var(--grain) 0 3px,transparent 3.6px),radial-gradient(circle at 66% 28%,var(--grain) 0 2px,transparent 2.6px),radial-gradient(circle at 55% 70%,var(--grain) 0 3.2px,transparent 3.8px),radial-gradient(circle at 24% 72%,var(--grain) 0 1.8px,transparent 2.3px),var(--signal)}

/* Fenêtres */
.ov{position:fixed;inset:0;background:color-mix(in srgb,#000 55%,transparent);z-index:100;display:flex;align-items:flex-start;justify-content:center;padding:max(24px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 24px max(12px,env(safe-area-inset-left,0px));overflow-y:auto}
.modal{background:var(--surface);border-radius:8px;width:100%;max-width:640px;border-top:4px solid var(--signal);box-shadow:0 20px 50px rgba(0,0,0,.3)}
.modal.wide{max-width:960px}
.modal header{display:flex;align-items:flex-start;gap:12px;padding:16px 20px 12px;border-bottom:1px solid var(--line)}
.modal header h3{font-family:var(--f-display);font-weight:700;font-size:22px;letter-spacing:-.01em;margin:0;line-height:1.1}
.modal header p{margin:3px 0 0;font-size:13px;color:var(--ink-2)}
.modal .x{margin-left:auto;background:none;border:0;font-size:22px;line-height:1;cursor:pointer;color:var(--ink-3);padding:2px 6px}
.modal .mb{padding:16px 20px}
.modal footer{display:flex;gap:8px;justify-content:flex-end;padding:12px 20px 16px;border-top:1px solid var(--line);flex-wrap:wrap}
.fg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 14px}
.fg .full{grid-column:1/-1}
.f{display:flex;flex-direction:column;gap:5px;min-width:0}
.f label{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);font-weight:600}
.f input,.f select,.f textarea{border:1px solid var(--line-2);border-radius:var(--r);padding:8px 10px;background:var(--surface);width:100%;min-width:0}
.f textarea{min-height:64px;resize:vertical}
.f .hint{font-size:12px;color:var(--ink-3)}
.f.err input,.f.err select{border-color:var(--crit)}
.f.err .hint{color:var(--crit)}
.calc{background:var(--surface-2);border-radius:var(--r);padding:10px 12px;font-size:13px;display:flex;gap:18px;flex-wrap:wrap;margin-top:12px}
.calc b{font-family:var(--f-mono);font-weight:500}
.formerr{color:var(--crit);font-size:13px;margin-top:10px}
.sect{font-family:var(--f-display);font-weight:600;font-size:15.5px;color:var(--ink-2);margin:18px 0 8px;padding-top:12px;border-top:1px dashed var(--line-2)}
.dl{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px 16px;font-size:13.5px}
.dl div{min-width:0}.dl dt{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);font-weight:600}.dl dd{margin:2px 0 0;overflow-wrap:anywhere}
.map{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px 12px}
.map .f select{padding:6px 8px;font-size:13px}
.map .f.hit select{border-color:var(--ok)}
.drop{border:2px dashed var(--line-2);border-radius:8px;padding:26px;text-align:center;cursor:pointer;color:var(--ink-2)}
.drop:hover,.drop.over{border-color:var(--signal);background:color-mix(in srgb,var(--signal) 8%,transparent)}
.inv-in{width:96px;text-align:right;padding:5px 8px;border:1px solid var(--line-2);border-radius:4px;background:var(--surface);font-family:var(--f-mono)}

.toast{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:max(16px,env(safe-area-inset-bottom,0px));z-index:200;background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:var(--r);font-size:13.5px;max-width:min(420px,calc(100vw - 32px));box-shadow:0 8px 24px rgba(0,0,0,.25);border-left:4px solid var(--ok)}
.toast.err{border-left-color:var(--crit)}

.tw table{min-width:620px}
@media (max-width:900px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.cols{grid-template-columns:minmax(0,1fr)}.panel.alerts{order:-1}.cols>.stack:last-child{order:-1}.map{grid-template-columns:repeat(2,minmax(0,1fr))}.dl{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.fg{grid-template-columns:minmax(0,1fr)}.map{grid-template-columns:minmax(0,1fr)}.kpi .v{font-size:19px}.page-head h2{font-size:26px}.search{max-width:none;margin-left:0;flex-basis:100%}.brand small{display:none}}
@media (prefers-reduced-motion:no-preference){.toast{animation:tin .18s ease-out}@keyframes tin{from{transform:translateY(8px);opacity:0}}}
</style>
</head>
<body>
<header class="band">
  <div class="wrap">
    <div class="top">
      <div class="brand"><div class="mark" aria-hidden="true"></div><div><h1>GesLiège</h1><small>Liège brut · transformation · immobilisations</small></div></div>
      <span class="mode" id="mode"><i></i><span>Connexion…</span></span>
      <button class="btn-band" id="btn-acc" type="button" hidden>Utilisateurs</button>
      <button class="btn-band" id="btn-export" type="button" hidden>Exporter Excel</button>
      <button class="btn-band" id="btn-out" type="button" hidden>Déconnexion</button>
    </div>
    <nav class="tabs" id="tabs" aria-label="Sections">
      <button type="button" data-p="dash">Tableau de bord</button>
      <button type="button" data-p="art">Articles</button>
      <button type="button" data-p="mvt">Mouvements</button>
      <button type="button" data-p="trf">Transformation</button>
      <button type="button" data-p="inv">Inventaire</button>
      <button type="button" data-p="imm">Immobilisations</button>
      <button type="button" data-p="imp">Import</button>

/** Lit un nombre au format français ou anglais : « 1 234,50 », « 1.234,5 », « 1234.5 », « 85 MAD ». Renvoie NaN si illisible, null si vide. */
function parseNum(v){
  if(v===null||v===undefined) return null;
  if(typeof v==='number') return isFinite(v)?v:NaN;
  let s=String(v).trim(); if(s==='') return null;
  s=s.replace(/[\s  ]/g,'').replace(/(mad|dhs?|dh|€|%)$/i,'');
  const lc=s.lastIndexOf(','), ld=s.lastIndexOf('.');
  if(lc>-1&&ld>-1){ if(lc>ld) s=s.replace(/\./g,'').replace(',','.'); else s=s.replace(/,/g,''); }
  else if(lc>-1){ s=s.replace(',','.'); }
  if(!/^-?\d*\.?\d+$/.test(s)) return NaN;
  return parseFloat(s);
}
/** Lit une date : objet Date, numéro de série Excel, « 15/03/2026 » ou « 2026-03-15 ». */
function parseDate(v){
  if(v===null||v===undefined||v==='') return null;
  const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  if(v instanceof Date) return isNaN(v)?'ERR':iso(new Date(v.getTime()+12*3600e3));
  if(typeof v==='number'){ if(v<1||v>80000) return 'ERR'; const d=new Date(Date.UTC(1899,11,30)+Math.round(v)*86400000); return d.getUTCFullYear()+'-'+String(d.getUTCMonth()+1).padStart(2,'0')+'-'+String(d.getUTCDate()).padStart(2,'0'); }
  const s=String(v).trim();
  let m=s.match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4})$/);
  if(m){ let y=+m[3]; if(y<100) y+=2000; const d=new Date(y,+m[2]-1,+m[1]); return (d.getMonth()===+m[2]-1)?iso(d):'ERR'; }
  m=s.match(/^(\d{4})-(\d{2})-(\d{2})/); if(m) return m[1]+'-'+m[2]+'-'+m[3];
  return 'ERR';
}

  return out;
}

/* Amortissement linéaire, prorata temporis au jour, base 365 j. */
function cumulAt(im, date){
  const va=+im.valeur||0, t=(+im.taux||0)/100, st=parseISO(im.date_service||im.date_achat);
  if(!st||t<=0||!date||date<st) return 0;
  const days=(date-st)/86400000+1;
  return Math.min(va, va*t*days/365);
}
function amort(im){
  const now=parseISO(todayISO()); const va=+im.valeur||0;
  const cum=r2(cumulAt(im,now));
  const prevEnd=new Date(now.getFullYear()-1,11,31);
  const dot=r2(cum - cumulAt(im,prevEnd));
  return {cum, vnc:r2(va-cum), dot};
}
function plan(im){
  const st=parseISO(im.date_service||im.date_achat); const va=+im.valeur||0; const rows=[];
  if(!st||!(+im.taux>0)) return rows;
  let y=st.getFullYear(), prev=0;
  for(let i=0;i<60;i++){
    const c=cumulAt(im,new Date(y,11,31));
    rows.push({an:y, dot:r2(c-prev), cum:r2(c), vnc:r2(va-c)});
    prev=c; if(va-c<0.005) break; y++;
  }
  return rows;
}

/* ───────────── Persistance ───────────── */
async function retry(fn){
  for(let i=0;;i++){
    try{ return await fn(); }
    catch(e){ if(e&&(e.code==='unavailable'||e.code==='resource_exhausted')&&i<4){ await sleep(350*(i+1)+Math.random()*300); continue; } throw e; }
  }
}

  if(/Failed to fetch|NetworkError|Load failed/i.test(m)) return 'Connexion au serveur impossible. Vérifiez votre accès Internet.';
  return m; }

function calcMvt(a, type, qte, pu){
  const q0=+a.qte||0, c0=+a.cmup||0;
  if(type==='entree'){
    const q1=q0+qte; const c1 = q1>0 ? (Math.max(q0,0)*c0 + qte*pu)/(Math.max(q0,0)+qte) : pu;
    return {delta:qte, q1:r3(q1), c1:r4(c1), pu:r4(pu), val:r2(qte*pu)};
  }
  if(type==='sortie'){
    if(qte>q0+1e-9) throw new Error('Stock insuffisant : '+qf(q0)+' '+(a.unite||'')+' disponibles.');
    return {delta:-qte, q1:r3(q0-qte), c1:c0, pu:c0, val:r2(-qte*c0)};
  }
  const q1=q0+qte; if(q1<-1e-9) throw new Error('Le stock ne peut pas devenir négatif.');
  return {delta:qte, q1:r3(q1), c1:c0, pu:c0, val:r2(qte*c0)};
}
/** Enregistre un mouvement. Sur le serveur, le stock et le CMUP sont recalculés dans une transaction verrouillée. */
async function addMvt(aid, type, qte, pu, info){
  if(remote()){
    const m=await q(SB.rpc('enregistrer_mouvement',{p_aid:aid,p_type:type,p_qte:qte,p_pu:pu||0,p_info:{date:info.date||todayISO(),piece:info.piece||'',motif:info.motif||'',of:info.of||''}}));
    const a=D().articles.find(x=>x.id===aid); if(a){ a.qte=+m.qte_apres; a.cmup=+m.cmup_apres; }
    if(!D().mouvements.some(x=>x.id===m.id)) D().mouvements.unshift(m);
    return m;
  }
  const a=D().articles.find(x=>x.id===aid); if(!a) throw new Error('Article introuvable.');
  const c=calcMvt(a,type,qte,pu);
  const m={id:mid(), aid, code:a.code, designation:a.designation, cat:a.cat, unite:a.unite||'', type,
    date:info.date||todayISO(), qte:c.delta, pu:c.pu, valeur:c.val, piece:info.piece||'', motif:info.motif||'',
    par:UID||'', ts:Date.now(), qte_apres:c.q1, cmup_apres:c.c1, of:info.of||''};
  D().mouvements.unshift(m); a.qte=c.q1; a.cmup=c.c1; a.maj_le=Date.now(); return m;
}

async function doAuth(){
  const v=id=>{const e=$('#'+id);return e?e.value:'';}; const err=$('#l-err'); err.textContent=''; clearErrs();
  const ident=v('l-ident').trim().toLowerCase(), mdp=v('l-mdp');
  if(!/^[a-z0-9._-]{3,30}$/.test(ident)){ setErr('l-ident','Identifiant invalide : 3 à 30 lettres, chiffres, point ou tiret, sans espace ni accent.'); return; }
  const email=ident+'@'+DOMAINE; const btn=$('#l-go'); btn.disabled=true;
  try{
    if(S.signup){
      if(mdp.length<8){ setErr('l-mdp','8 caractères minimum.'); return; }
      if(mdp!==v('l-mdp2')){ setErr('l-mdp2','Les deux mots de passe sont différents.'); return; }
      const {data,error}=await SB.auth.signUp({email,password:mdp,options:{data:{nom:v('l-nom').trim()||ident}}});
      if(error) throw new Error(/registered|already/i.test(error.message)?'Cet identifiant est déjà pris.':sbErr(error));
      if(!data.session){ err.textContent='Compte créé, mais la confirmation par e-mail est activée dans Supabase : désactivez-la, puis connectez-vous.'; S.signup=false; return; }
      S.signup=false; await startSession(data.session);
    } else {
      const {data,error}=await SB.auth.signInWithPassword({email,password:mdp});
      if(error) throw new Error(/Invalid login/i.test(error.message)?'Identifiant ou mot de passe incorrect.':sbErr(error));
      await startSession(data.session);
    }
  }catch(e){ err.textContent=e.message; }
  finally{ if(btn.isConnected) btn.disabled=false; }
}
async function startSession(session){
  S.uid=session.user.id; S.mode='loading'; S.demo=null; render();
  try{ await loadTable('profils'); }catch(e){ S.profils=[]; }
  const me=(S.profils||[]).find(p=>p.id===S.uid);
  if(!me||me.role==='attente'){ S.me=me?(me.nom||me.identifiant):''; S.mode='attente'; return render(); }
  S.mode='db'; applyProfil(me);
  try{ await loadAll(); }catch(e){ toast(e.message,'err'); }
  if(!S.subscribed){ subscribe(); S.subscribed=true; }
  render();
}
function applyProfil(me){
  if(me.role==='attente'){ S.mode='attente'; S.me=me.nom||me.identifiant; return; }
  S.role=me.role; S.canWrite=me.role!=='lecture'; S.me=me.nom||me.identifiant; UID=S.me;
}

  if(!USER) return; ids.forEach(id=>{ if(id!==UID&&S.names[id]===undefined) _nameQ.add(id); });
  if(!_nameQ.size||_nameT) return;
  _nameT=setTimeout(async()=>{ const q=[..._nameQ]; _nameQ.clear(); _nameT=0;
    try{ const ps=await USER.profiles(q); q.forEach(id=>{ S.names[id]=(ps[id]&&ps[id].name)||''; }); }catch(e){ q.forEach(id=>S.names[id]=''); }
    render(); },60);
}

const TRF={};
function openTrf(){
  Object.assign(TRF,{date:todayISO(), of:'', inId:'', qin:'', frais:'', lines:[{aid:'',q:'',kg:'',part:''}], err:''});
  modal(`<header><div><h3>Nouvelle transformation</h3><p>Consommation d’un article et production d’un ou plusieurs autres, valorisées au coût.</p></div><button class="x" data-a="close" type="button" aria-label="Fermer">×</button></header><div class="mb" id="trf-body"></div>

  renderTrf(); $('#trf-save').onclick=saveTrf;

const artOpts=(cats,val,needStock)=>`<option value="">— choisir —</option>`+D().articles.filter(a=>cats.includes(a.cat)&&(!needStock||(+a.qte||0)>0)).sort((x,y)=>String(x.code).localeCompare(String(y.code),'fr',{numeric:true})).map(a=>`<option value="${esc(a.id)}" ${a.id===val?'selected':''}>${esc(a.code)} · ${esc(a.designation)}${needStock?' ('+qf(a.qte)+' '+esc(a.unite)+')':''}</option>`).join('');
function trfCalc(){
  const A=D().articles, a=A.find(x=>x.id===TRF.inId);
  const qin=parseNum(TRF.qin), fr=parseNum(TRF.frais)||0;
  const r={a, qin, fr, ok:false, lines:[]};
  if(!a||!(qin>0)) return r;
  r.cin=r2(qin*(+a.cmup||0)); r.total=r2(r.cin+fr); r.inKg=toKg(qin,a.unite);
  r.lines=TRF.lines.map(l=>{ const o=A.find(x=>x.id===l.aid); const q=parseNum(l.q); const kg=o&&KG[o.unite]!=null&&q>0?toKg(q,o.unite):parseNum(l.kg); const part=parseNum(l.part);
    return {o,q,kg:kg>0?kg:null,part:part>=0?part:null}; });
  const parts=r.lines.reduce((s,l)=>s+(l.part||0),0); r.parts=r2(parts);
  const all=r.lines.filter(l=>l.kg!=null), ut=all.filter(l=>l.o&&l.o.cat!=='gr');
  r.outKg=all.reduce((s,l)=>s+l.kg,0); r.utKg=ut.reduce((s,l)=>s+l.kg,0);
  const allKnown=r.lines.every(l=>l.kg!=null);
  r.rend = r.inKg&&ut.length ? r.utKg/r.inKg : null; r.pertes = r.inKg&&allKnown ? r.inKg-r.outKg : null;
  r.lines.forEach(l=>{ l.pu = l.o&&l.q>0&&l.part!=null ? r4(r.total*l.part/100/l.q) : null; });
  return r;
}

    ${fld('t-of','N° d’ordre de fabrication',`<input id="t-of" value="${esc(TRF.of)}" placeholder="OF-${new Date().getFullYear()}-001" autocomplete="off">`)}
    ${fld('t-in','Article consommé *',`<select id="t-in">${artOpts(['mp','sf','gr'],TRF.inId,true)}</select>`,'full')}
    ${fld('t-qin','Quantité consommée'+(a?' ('+esc(a.unite)+')':'')+' *',`<input id="t-qin" inputmode="decimal" value="${esc(TRF.qin)}" autocomplete="off">`,'',a?'Stock '+qf(a.qte)+' '+esc(a.unite)+' · CMUP '+mad(a.cmup):'')}
    ${fld('t-frais','Frais de transformation (MAD)',`<input id="t-frais" inputmode="decimal" value="${esc(TRF.frais)}" autocomplete="off">`,'','Main-d’œuvre, énergie de bouillage, sous-traitance.')}
  </div>
  <div class="sect">Produits obtenus</div>
  <div class="tw" style="border:1px solid var(--line)"><table><thead><tr><th>Article produit</th><th class="n">Quantité</th><th class="n">Poids (kg)</th><th class="n">Part du coût (%)</th><th class="n">Coût unitaire</th><th></th></tr></thead><tbody>
  ${TRF.lines.map((l,i)=>{ const o=D().articles.find(x=>x.id===l.aid); const mass=o&&KG[o.unite]!=null; const cl=c.lines[i]||{};
    return `<tr><td><select id="t-o${i}" data-tl="${i}" data-f="aid" style="width:100%;min-width:220px;padding:6px 8px;border:1px solid var(--line-2);border-radius:4px;background:var(--surface)">${artOpts(outs,l.aid,false)}</select></td>
    <td class="n"><input class="inv-in" id="t-q${i}" data-tl="${i}" data-f="q" inputmode="decimal" value="${esc(l.q)}"> <span class="muted">${o?esc(o.unite):''}</span></td>
    <td class="n">${mass?`<span class="muted">${cl.kg!=null?qf(r2(cl.kg)):'—'}</span>`:`<input class="inv-in" id="t-k${i}" data-tl="${i}" data-f="kg" inputmode="decimal" value="${esc(l.kg)}" placeholder="facult.">`}</td>
    <td class="n"><input class="inv-in" id="t-p${i}" data-tl="${i}" data-f="part" inputmode="decimal" value="${esc(l.part)}" style="width:72px"></td>
    <td class="n">${cl.pu!=null?nfM.format(cl.pu):'—'}</td>
    <td>${TRF.lines.length>1?`<button class="btn ghost sm" data-a="trf-del" data-i="${i}" type="button" aria-label="Retirer la ligne">×</button>`:''}</td></tr>`; }).join('')}
  </tbody></table></div>
  <div class="toolbar" style="margin-top:8px"><button class="btn sm" data-a="trf-add" type="button">Ajouter un produit</button><button class="btn sm" data-a="trf-split" type="button">Répartir le coût au poids</button><span class="grow"></span><span class="${c.parts&&Math.abs(c.parts-100)>0.01?'neg':'muted'}">Parts : ${nfQ.format(c.parts||0)} %</span></div>
  <div class="calc">${c.a&&c.qin>0?`<span>Coût consommé <b>${mad(c.cin)}</b></span><span>Coût total <b>${mad(c.total)}</b></span>${c.inKg?`<span>Poids consommé <b>${qf(r2(c.inKg))} kg</b></span>`:''}<span>Rendement utile <b>${c.rend!=null?nf0.format(c.rend*100)+' %':'—'}</b></span><span>Pertes <b>${c.pertes!=null?qf(r2(c.pertes))+' kg':'—'}</b></span>`:'<span class="muted">Choisissez l’article consommé et la quantité pour voir le coût et le rendement.</span>'}</div>
  <div class="formerr" id="t-err">${esc(TRF.err)}</div>`;
  if(fid){ const el=document.getElementById(fid); if(el){ el.focus(); if(el.setSelectionRange&&el.type!=='date'&&el.tagName==='INPUT') try{const n=el.value.length;el.setSelectionRange(n,n)}catch(e){} } }
}
function trfSplit(){
  const c=trfCalc(); const ls=c.lines; if(!ls.length||ls.some(l=>l.kg==null)){ TRF.err='Renseignez le poids de chaque produit pour répartir au poids.'; return renderTrf(); }
  const tot=ls.reduce((s,l)=>s+l.kg,0); let acc=0;
  TRF.lines.forEach((l,i)=>{ const v=i===ls.length-1? r2(100-acc) : r2(ls[i].kg/tot*100); acc+=v; l.part=String(v).replace('.',','); });
  TRF.err=''; renderTrf();
}
async function saveTrf(){
  const c=trfCalc(); TRF.err='';
  if(!c.a) TRF.err='Choisissez l’article consommé.';
  else if(!(c.qin>0)) TRF.err='Quantité consommée attendue.';
  else if(c.qin>(+c.a.qte||0)+1e-9) TRF.err='Stock insuffisant : '+qf(c.a.qte)+' '+c.a.unite+' disponibles.';
  else if(!c.lines.length||c.lines.some(l=>!l.o||!(l.q>0)||l.part==null)) TRF.err='Chaque produit doit avoir un article, une quantité positive et une part du coût.';
  else if(c.lines.some(l=>l.o.id===c.a.id)) TRF.err='Un produit ne peut pas être l’article consommé.';
  else if(new Set(c.lines.map(l=>l.o.id)).size!==c.lines.length) TRF.err='Un même article apparaît deux fois dans les produits.';
  else if(Math.abs(c.parts-100)>0.01) TRF.err='Les parts du coût doivent totaliser 100 % (actuellement '+nfQ.format(c.parts)+' %).';
  else if(!parseISO(TRF.date)) TRF.err='Date attendue.';
  if(TRF.err) return renderTrf();
  const btn=$('#trf-save'); btn.disabled=true; btn.textContent='Enregistrement…';
  const id=mid();
  const info={date:TRF.date, piece:TRF.of||'', of:id};
  try{
    if(remote()){
      await q(SB.rpc('enregistrer_transformation',{p:{id,date:TRF.date,of:TRF.of||'',in_aid:c.a.id,in_qte:c.qin,frais:c.fr,outs:c.lines.map(l=>({aid:l.o.id,qte:l.q,kg:l.kg,part:l.part})),in_kg:c.inKg,utile_kg:c.utKg,total_kg:c.outKg,rendement:c.rend,pertes_kg:c.pertes}}));
      await Promise.all(['articles','mouvements','transfos'].map(loadTable));
      closeModal(); toast('Transformation enregistrée'+(c.rend!=null?' · rendement utile '+nf0.format(c.rend*100)+' %':'')+'.'); render(); return;
    }
    await addMvt(c.a.id,'sortie',c.qin,0,{...info,motif:'Consommation transformation'});
    const outs=[];
    for(const l of c.lines){ await addMvt(l.o.id,'entree',l.q,l.pu,{...info,motif:'Production'}); outs.push({aid:l.o.id,code:l.o.code,designation:l.o.designation,cat:l.o.cat,qte:l.q,unite:l.o.unite,kg:l.kg,part:l.part,pu:l.pu}); }
    const doc={id, date:TRF.date, of:TRF.of||'', in_aid:c.a.id, in_code:c.a.code, in_designation:c.a.designation, in_qte:c.qin, in_unite:c.a.unite, in_cmup:+c.a.cmup||0,
      frais:c.fr, cout_total:c.total, in_kg:c.inKg, outs, utile_kg:c.utKg, total_kg:c.outKg, rendement:c.rend, pertes_kg:c.pertes, par:UID||'', ts:Date.now()};
    Object.keys(doc).forEach(k=>{ if(doc[k]===null||doc[k]===undefined) delete doc[k]; });
    doc.outs=doc.outs.map(o=>{ const x={...o}; Object.keys(x).forEach(k=>{ if(x[k]===null||x[k]===undefined) delete x[k]; }); return x; });
    D().transfos=D().transfos||[]; D().transfos.unshift(doc);
    closeModal(); toast('Transformation enregistrée'+(c.rend!=null?' · rendement utile '+nf0.format(c.rend*100)+' %':'')+'.'); render();
  }catch(e){ btn.disabled=false; btn.textContent='Réessayer'; TRF.err=(e.message||e.code||'Erreur')+(remote()?' Rien n’a été enregistré.':''); renderTrf(); }
}

const impKind = () => IMP.target==='imm'?'imm':'art';
function autoMap(){
  const F=IMP_FIELDS[impKind()], used=new Set(), H=IMP.hdr.map(norm); IMP.map={};
  F.forEach(f=>{ const i=H.findIndex((h,ix)=>h&&!used.has(ix)&&f.syn.includes(h)); if(i>=0){ IMP.map[f.k]=i; used.add(i); } });
}
function guessImmoType(v){
  const s=norm(v); if(!s) return 'mat';
  const byC=IMMO_TYPES.find(t=>s.startsWith(t.compte)); if(byC) return byC.k;
  if(/terrain/.test(s)) return 'terrain'; if(/constr|batim|local|hangar/.test(s)) return 'constr';
  if(/transport|vehicule|camion|voiture|utilitaire/.test(s)) return 'transp'; if(/informat|ordinat|pc|serveur|imprim/.test(s)) return 'info';
  if(/mobilier/.test(s)) return 'mob'; if(/bureau/.test(s)) return 'matbur'; if(/agenc|amenag|install/.test(s)) return 'agen';
  if(/materiel|outil|engin|machine/.test(s)) return 'mat'; return 'autre';
}
function impParse(){
  const F=IMP_FIELDS[impKind()], kind=impKind();
  const existing=new Set((kind==='imm'?D().immos:D().articles).map(x=>norm(x.code)));
  const seen=new Set();
  return IMP.rows.map((row,ix)=>{
    const o={}, errs=[];
    F.forEach(f=>{ const c=IMP.map[f.k]; if(c===undefined||c===null||c==='') return; const v=row[c];
      if(f.t==='num'){ const n=parseNum(v); if(n!==null&&isNaN(n)) errs.push(f.l+' illisible (« '+String(v)+' »)'); else if(n!==null) o[f.k]=n; }
      else if(f.t==='date'){ const d=parseDate(v); if(d==='ERR') errs.push(f.l+' illisible'); else if(d) o[f.k]=d; }
      else { const s=(v instanceof Date)?parseDate(v):String(v??'').trim(); if(s) o[f.k]=s; } });
    F.filter(f=>f.req).forEach(f=>{ if(o[f.k]===undefined||o[f.k]==='') errs.push(f.l+' manquant'); });
    if(o.qte!=null&&o.qte<0) errs.push('Quantité négative');
    if(o.valeur!=null&&o.valeur<0) errs.push('Valeur négative');
    let st='ok'; const nc=norm(o.code);
    if(errs.length) st='err'; else if(seen.has(nc)) {st='err'; errs.push('Code en double dans le fichier');} else if(existing.has(nc)) st='dup';
    if(nc) seen.add(nc);
    return {ix:ix+2, o, st, errs};
  });
}

async function loadFile(file){
  if(!file) return;
  try{
    const buf=await file.arrayBuffer();
    IMP.wb=XLSX.read(buf,{type:'array',cellDates:true});
    IMP.fname=file.name; IMP.sheet=IMP.wb.SheetNames[0]; readSheet();
  }catch(e){ toast('Fichier illisible : vérifiez qu’il s’agit bien d’un classeur Excel ou d’un CSV.','err'); }
}
function readSheet(){
  const ws=IMP.wb.Sheets[IMP.sheet];
  const rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:'',raw:true,blankrows:false});
  IMP.hdr=(rows[0]||[]).map(h=>String(h??'').trim());
  IMP.rows=rows.slice(1).filter(r=>r.some(c=>String(c??'').trim()!==''));
  IMP.prog=''; autoMap(); render();
}
async function runImport(){
  const kind=impKind(), P=impParse().filter(p=>p.st==='ok'||(p.st==='dup'&&IMP.dup==='update'));
  if(!P.length) return;
  IMP.busy=true; let done=0, fail=0; const date=todayISO();
  for(const p of P){
    IMP.prog=`Import en cours… ${done}/${P.length}`; render();
    try{
      if(kind==='imm'){
        const ex=D().immos.find(x=>norm(x.code)===norm(p.o.code));
        const t=p.o.type?guessImmoType(p.o.type):(ex?ex.type:'mat');
        const im={...(ex||{id:mid(), etat:'En service', cree_le:Date.now()}),
          code:p.o.code, designation:p.o.designation, type:t, valeur:r2(p.o.valeur), taux:p.o.taux!=null?p.o.taux:(ex?ex.taux:IMMO_BY[t].taux)};
        ['date_achat','date_service','marque','num_serie','localisation','responsable','fournisseur'].forEach(k=>{ if(p.o[k]!==undefined) im[k]=p.o[k]; });
        if(!im.date_service&&!im.date_achat) im.date_achat=date;
        await saveImmo(im);
      } else {
        const ex=D().articles.find(x=>norm(x.code)===norm(p.o.code));
        const a={...(ex||{id:mid(), qte:0, cmup:0, cree_le:Date.now()}), cat:ex?ex.cat:IMP.target,
          code:p.o.code, designation:p.o.designation};
        ['unite','famille','emplacement','fournisseur','machine','ref_fab','notes','origine','canton','lot_adj','calibre','qualite','dimensions','granulo'].forEach(k=>{ if(p.o[k]!==undefined) a[k]=p.o[k]; });
        if(p.o.qte_min!==undefined) a.qte_min=p.o.qte_min; if(p.o.prix_vente!==undefined) a.prix_vente=p.o.prix_vente;
        if(!a.unite) a.unite=IMP.target==='pf'?'mille':IMP.target==='mc'?'u':'kg';
        await saveArticle(a);
        if(!ex && p.o.qte>0){ await addMvt(a.id,'entree',p.o.qte,p.o.pu||0,{date,piece:'Reprise '+IMP.fname.slice(0,40),motif:'Stock initial (import)'}); }
      }
      done++;
    }catch(e){ fail++; if(e&&e.code==='quota_exceeded'){ toast('Capacité de stockage atteinte : import interrompu après '+done+' lignes.','err'); break; } }

function openArticle(id, cat){
  const a = id ? D().articles.find(x=>x.id===id) : {cat:cat||(S.f.cat!=='all'?S.f.cat:'sf'), unite:({pf:'mille',mc:'u'})[cat||S.f.cat]||'kg'};
  if(!a) return;
  const isNew=!id; const c=a.cat;
  const ex=(EXTRA[c]||[]).map(f=>{
    const v=a[f.k]; const id2='a-'+f.k;
    if(f.t==='sel') return fld(id2,f.l,selx(id2,f.o,v));

    clearErrs(); $('#a-err').textContent='';

    if(o.qte_min!==null&&(isNaN(o.qte_min)||o.qte_min<0)){setErr('a-qte_min','Nombre positif attendu.');bad=true;}

    if(isNew){ q0=parseNum($('#a-q0').value); pu0=parseNum($('#a-pu0').value);
      if(q0!==null&&(isNaN(q0)||q0<0)){setErr('a-q0','Nombre positif attendu.');bad=true;}

      const rec={...a, ...o}; if(isNew){ rec.id=mid(); rec.qte=0; rec.cmup=0; rec.cree_le=Date.now(); }
      Object.keys(rec).forEach(k=>{ if(rec[k]===null||rec[k]===undefined||rec[k]==='') delete rec[k]; });
      rec.qte=+rec.qte||0; rec.cmup=+rec.cmup||0;
      await saveArticle(rec);
      if(isNew&&q0>0) await addMvt(rec.id,'entree',q0,pu0,{date:todayISO(),motif:'Stock initial',piece:''});
      closeModal(); toast(isNew?'Article créé.':'Article enregistré.'); render();
    }catch(e){ btn.disabled=false; btn.textContent='Enregistrer'; $('#a-err').textContent='Échec de l’enregistrement : '+(e.message||e.code||'erreur inconnue')+'. Réessayez.'; }
  };
}
function collectArticle(a){
  const v=id=>{ const el=$('#'+id); return el?el.value.trim():''; };
  const cat=$('#a-cat')?$('#a-cat').value:a.cat;
  const o={cat, code:v('a-code'), designation:v('a-designation'), unite:v('a-unite')||'kg', emplacement:v('a-emplacement'), notes:v('a-notes')};
  const m=v('a-qte_min'); o.qte_min=m===''?null:parseNum(m);
  (EXTRA[cat]||[]).forEach(f=>{ const x=v('a-'+f.k); o[f.k]= f.t==='num'?(x===''?null:parseNum(x)):x; });
  return o;
}

/* Mouvement */
function openMvt(id, type){
  const a=D().articles.find(x=>x.id===id); if(!a) return;
  const E=type==='entree';
  modal(`<header><div><h3>${E?'Entrée en stock':'Sortie de stock'}</h3><p>${esc(a.code)} · ${esc(a.designation)} — stock ${qf(a.qte)} ${esc(a.unite)}, CMUP ${mad(a.cmup)}</p></div><button class="x" data-a="close" type="button" aria-label="Fermer">×</button></header>
  <div class="mb"><div class="fg">
    ${fld('m-date','Date',inp('m-date',todayISO(),'type="date"'))}
    ${fld('m-qte','Quantité ('+esc(a.unite)+') *',inp('m-qte','','inputmode="decimal" autocomplete="off"'))}
    ${E?fld('m-pu','Coût unitaire HT (MAD) *',inp('m-pu',a.cmup?String(a.cmup).replace('.',','):'','inputmode="decimal"'),'',a.cat==='pf'||a.cat==='sf'?'Coût de production de l’unité.':'Prix d’achat HT + frais accessoires.'):fld('m-pu','Coût de sortie',`<input id="m-pu" value="${esc(mad(a.cmup))}" disabled>`,'','Valorisée au CMUP actuel.')}
    ${fld('m-piece',E?'N° de pièce (BL, BR, OF…)':'N° de pièce (BS, BL client…)',inp('m-piece','','autocomplete="off"'))}
    ${fld('m-motif','Motif',selx('m-motif',MOTIFS[type],MOTIFS[type][0],false),'full')}
  </div><div class="calc" id="m-calc"></div><div class="formerr" id="m-err"></div></div>
  <footer><button class="btn" data-a="close" type="button">Annuler</button><button class="btn primary" id="m-save" type="button">Enregistrer ${E?'l’entrée':'la sortie'}</button></footer>`);
  const upd=()=>{ const q=parseNum($('#m-qte').value), pu=E?parseNum($('#m-pu').value):a.cmup;
    if(!(q>0)||(E&&!(pu>=0))){ $('#m-calc').innerHTML='<span class="muted">Saisissez la quantité'+(E?' et le coût':'')+' pour voir le stock après mouvement.</span>'; return; }
    try{ const c=calcMvt(a,type,q,pu); $('#m-calc').innerHTML=`<span>Valeur <b>${mad(Math.abs(c.val))}</b></span><span>Stock après <b>${qf(c.q1)} ${esc(a.unite)}</b></span><span>CMUP après <b>${mad(c.c1)}</b></span>`; }
    catch(e){ $('#m-calc').innerHTML=`<span class="neg">${esc(e.message)}</span>`; } };
  $('#m-qte').oninput=upd; if(E) $('#m-pu').oninput=upd; upd();
  $('#m-save').onclick=async()=>{
    clearErrs(); $('#m-err').textContent='';
    const q=parseNum($('#m-qte').value), pu=E?parseNum($('#m-pu').value):a.cmup, d=$('#m-date').value;
    let bad=false;
    if(!(q>0)){setErr('m-qte','Quantité positive attendue.');bad=true;}
    if(E&&!(pu>=0)){setErr('m-pu','Coût attendu (0 accepté pour un don ou un échantillon).');bad=true;}
    if(!parseISO(d)){setErr('m-date','Date attendue.');bad=true;}
    if(bad) return;
    const btn=$('#m-save'); btn.disabled=true; btn.textContent='Enregistrement…';
    try{ await addMvt(a.id,type,q,pu,{date:d,piece:$('#m-piece').value.trim(),motif:$('#m-motif').value}); closeModal(); toast((E?'Entrée':'Sortie')+' enregistrée : '+qf(q)+' '+a.unite+' · '+a.code); render(); }

  };

  const det=[['Compte',CATS[a.cat]?CATS[a.cat].compte+' · '+CATS[a.cat].label:'—'],['Stock',qf(a.qte)+' '+a.unite],['CMUP',mad(a.cmup)],['Valeur',mad(valeur(a))],['Seuil d’alerte',a.qte_min!=null&&a.qte_min!==''?qf(a.qte_min)+' '+a.unite:'—'],['Emplacement',a.emplacement||'—']];

    .concat([...D().immos].map(i=>{const a=amort(i),t=IMMO_BY[i.type]||IMMO_BY.autre;return [t.compte,t.label,i.code,i.designation,+i.valeur||0,+i.taux||0,parseISO(i.date_achat)||'',parseISO(i.date_service)||'',a.dot,a.cum,a.vnc,i.etat||'',i.localisation||'',i.responsable||'',i.marque||'',i.num_serie||'']}));
  const ws3=XLSX.utils.aoa_to_sheet(im,{cellDates:true}); ws3['!cols']=[8,26,12,34,16,8,13,13,16,18,14,13,16,16,18,14].map(w=>({wch:w}));
  XLSX.utils.book_append_sheet(wb,ws3,'Immobilisations');
  [ws1,ws2,wsT,ws3].forEach(ws=>{ Object.keys(ws).forEach(k=>{ const c=ws[k]; if(k[0]==='!'||!c) return; if(c.t==='n') c.z=Number.isInteger(c.v)?'# ##0':'# ##0.00'; if(c.t==='d') c.z='dd/mm/yyyy'; }); });
  return wb;
}
function downloadBlob(name, blob){ const u=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=u; a.download=name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(u),2000); }
async function saveFile(name, data){ downloadBlob(name, data instanceof Blob?data:new Blob([data])); toast('Fichier prêt : '+name); }

/* Inventaire : validation */
async function validateInv(){
  const A=D().articles.filter(a=>a.cat===S.inv.cat);
  const L=A.map(a=>{ const raw=S.inv.counts[a.id]; const c=raw===undefined||raw===''?null:parseNum(raw); if(c==null||isNaN(c)) return null; const d=r3(c-(+a.qte||0)); return Math.abs(d)>1e-9?{a,d,c}:null; }).filter(Boolean);
  if(!L.length) return;
  if(L.some(x=>x.c<0)) return toast('Une quantité comptée est négative : corrigez-la avant de valider.','err');
  const v=L.reduce((s,x)=>s+x.d*(+x.a.cmup||0),0);
  if(!await confirmBox('Valider l’inventaire', L.length+' ajustement'+(L.length>1?'s':'')+' seront enregistrés pour un écart total de '+mad(v)+'. Les mouvements créés ne se modifient pas ensuite.','Valider')) return;
  const piece=S.inv.piece||('INV-'+S.inv.date); let ok=0, ko=0;
  for(const x of L){ try{ await addMvt(x.a.id,'inventaire',x.d,0,{date:S.inv.date,piece,motif:'Écart d’inventaire'}); ok++; delete S.inv.counts[x.a.id]; }catch(e){ ko++; } }
  toast(ok+' ajustement'+(ok>1?'s':'')+' enregistré'+(ok>1?'s':'')+(ko?' · '+ko+' en échec (stock modifié entre-temps ?)':''), ko?'err':'ok'); render();
}

document.addEventListener('click', async e=>{
  const t=e.target.closest('[data-a]'); if(!t) { if(e.target.id==='ov') closeModal(); return; }
  const a=t.dataset.a, id=t.dataset.id;
  if(a==='close') return closeModal();
  if(a==='goto'){ closeModal(); S.page=t.dataset.p; return render(); }
  if(a==='demo'){ S.demo=demoData(); return render(); }
  if(a==='auth-toggle'){ S.signup=!S.signup; return render(); }
  if(a==='logout') return logout();
  if(a==='recheck'){ const {data}=await SB.auth.getSession(); return data.session?startSession(data.session):logout(); }
  if(a==='pwd'){ const v=$('#u-mdp').value; if(v.length<8) return toast('8 caractères minimum.','err'); const {error}=await SB.auth.updateUser({password:v}); if(error) return toast(sbErr(error),'err'); $('#u-mdp').value=''; return toast('Mot de passe modifié.'); }
  if(a==='new-art') return openArticle(null);
  if(a==='recep') return openReception();
  if(a==='new-trf') return openTrf();
  if(a==='trf-add'){ TRF.lines.push({aid:'',q:'',kg:'',part:''}); return renderTrf(); }
  if(a==='trf-del'){ TRF.lines.splice(+t.dataset.i,1); return renderTrf(); }
  if(a==='trf-split') return trfSplit();
  if(a==='edit-art') return openArticle(id);
  if(a==='fiche'){ if(e.target.closest('button')) return; return openFiche(id); }
  if(a==='mv'){ e.stopPropagation(); return openMvt(id, t.dataset.t); }
  if(a==='del-art'){
    const ar=D().articles.find(x=>x.id===id); if(!ar) return;
    if((+ar.qte||0)!==0){ $('#a-err').textContent='Suppression impossible : le stock n’est pas nul. Soldez-le d’abord par une sortie ou un inventaire.'; return; }
    if(!await confirmBox('Supprimer l’article', ar.code+' · '+ar.designation+' sera retiré de la liste. Ses mouvements restent dans le journal.','Supprimer',true)) return;
    try{ await deleteArticle(id); toast('Article supprimé.'); }catch(err){ toast('Suppression impossible : '+(err.message||err.code),'err'); } return render();
  }
  if(['new-imm','edit-imm','del-imm','del-art','inv-ok','imp-go'].includes(a)&&!isAdm()) return toast('Action réservée aux administrateurs.','err');
  if(a==='new-imm') return openImmo(null);
  if(a==='edit-imm') return openImmo(id);
  if(a==='fiche-imm') return openImmoFiche(id);
  if(a==='del-imm'){
    const im=D().immos.find(x=>x.id===id); if(!im) return;
    if(!await confirmBox('Supprimer l’immobilisation', im.code+' · '+im.designation+' sera supprimée définitivement. Pour une cession ou une mise au rebut, préférez l’état « Hors service ».','Supprimer',true)) return;
    try{ await deleteImmo(id); toast('Immobilisation supprimée.'); }catch(err){ toast('Suppression impossible : '+(err.message||err.code),'err'); } return render();
  }
  if(a==='fcat'){ S.f.cat=t.dataset.k; return render(); }
  if(a==='falert'){ S.f.alert=!S.f.alert; return render(); }
  if(a==='jtype'){ S.j.type=t.dataset.k; return render(); }
  if(a==='icat'){ S.inv.cat=t.dataset.k; return render(); }
  if(a==='inv-clear'){ S.inv.counts={}; return render(); }
  if(a==='inv-ok') return validateInv();
  if(a==='imp-go') return runImport();
  if(a==='tpl') return doTemplate();
});

document.addEventListener('change', e=>{
  const t=e.target;

  else if(t.id==='imp-dup'){ IMP.dup=t.value; render(); }
  else if(t.dataset.map){ const v=t.value; if(v==='') delete IMP.map[t.dataset.map]; else { const n=+v; Object.keys(IMP.map).forEach(k=>{ if(IMP.map[k]===n&&k!==t.dataset.map) delete IMP.map[k]; }); IMP.map[t.dataset.map]=n; } render(); }
  else if(t.id==='imp-file'){ loadFile(t.files[0]); t.value=''; }

});

/* ───────────── Démarrage ───────────── */
async function boot(){
  try{ const p=localStorage.getItem('gs-page'); if(p) S.page=p; }catch(_){}
  if(!CFG.url||!CFG.cle||!window.supabase){ S.mode='setup'; return render(); }
  SB=window.supabase.createClient(CFG.url, CFG.cle);
  S.mode='auth'; render();
  try{ const {data}=await SB.auth.getSession(); if(data.session) await startSession(data.session); }catch(e){ toast(sbErr(e),'err'); }
  SB.auth.onAuthStateChange((ev)=>{ if(ev==='SIGNED_OUT'&&S.mode!=='auth'){ S.mode='auth'; S.data=EMPTY(); render(); } });
  window.addEventListener('focus', ()=>{ if(S.mode==='db') loadAll().catch(()=>{}); });
}
boot();
